<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E.DW416 — Архив, баримт бичигтэй ажиллах арга зүй</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <p class="course-code">E.DW416</p>
    <h1>Архив, баримт бичигтэй ажиллах арга зүй</h1>
    <nav class="view-switch" aria-label="Хэсэг сонгох">
      <button type="button" data-view="lecture" aria-pressed="true">Лекц</button>
      <button type="button" data-view="seminar" aria-pressed="false">Семинар</button>
      <button type="button" data-view="laws" aria-pressed="false">Эрх зүйн сан</button>
      <button type="button" data-view="docs" aria-pressed="false">Лавлах</button>
      <button type="button" data-view="map" aria-pressed="false">Зураглал</button>
    </nav>
  </header>

  <!-- Лекц: 8 лекц -->
  <main class="layout" id="view-lecture">
    <nav class="sidebar" aria-label="Лекцийн жагсаалт">
      <ol class="topic-list" id="lecture-list"></ol>
    </nav>
    <article class="topic" id="lecture-area" aria-live="polite"></article>
  </main>

  <!-- Семинар: 16 семинар -->
  <main class="layout" id="view-seminar" hidden>
    <nav class="sidebar" aria-label="Семинарын жагсаалт">
      <ol class="topic-list" id="seminar-list"></ol>
    </nav>
    <article class="topic" id="seminar-area" aria-live="polite"></article>
  </main>

  <nav class="pager" id="pager" aria-label="Шилжих">
    <button type="button" id="prev-btn">← Өмнөх</button>
    <span class="pager-pos" id="pager-pos"></span>
    <button type="button" id="next-btn">Дараах →</button>
  </nav>

  <!-- Эрх зүйн сан -->
  <main class="layout single" id="view-laws" hidden>
    <article class="topic" id="laws-area"></article>
  </main>

  <!-- Лавлах: 31 нэр төрөл (docs-data.js, docs-view.js) -->
  <main class="layout" id="view-docs" hidden>
    <nav class="sidebar" aria-label="Баримтын төрөл ба нэр">
      <div class="chapter-tabs" id="docs-tabs" role="tablist"></div>
      <p class="chapter-title" id="docs-title"></p>
      <ol class="topic-list" id="docs-list"></ol>
    </nav>
    <article class="topic" id="docs-area" aria-live="polite"></article>
  </main>

  <nav class="pager" id="docs-pager" aria-label="Баримт шилжих" hidden>
    <button type="button" id="docs-prev">← Өмнөх</button>
    <span class="pager-pos" id="docs-pos"></span>
    <button type="button" id="docs-next">Дараах →</button>
  </nav>

  <!-- Оюуны зураглал -->
  <main class="layout single" id="view-map" hidden>
    <iframe class="map-frame" id="map-frame" title="Хичээлийн оюуны зураглал"></iframe>
    <p class="hint"><a href="mindmap.html" target="_blank" rel="noopener">Зураглалыг бүтэн дэлгэцээр нээх</a></p>
  </main>

  <footer class="site-footer">
    <p id="checked-note"></p>
  </footer>

  <script src="lectures.js"></script>
  <script src="seminars.js"></script>
  <script src="laws.js"></script>
  <script src="app.js"></script>
  <script src="docs-data.js"></script>
  <script src="docs-view.js"></script>
</body>
</html>
