<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E.DW416 — Архив, баримт бичиг</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <p class="course-code">E.DW416</p>
    <h1>Архив, баримт бичигтэй ажиллах арга зүй</h1>
    <nav class="view-switch" aria-label="Хэсэг сонгох">
      <button type="button" data-view="content" aria-pressed="true">Агуулга</button>
      <button type="button" data-view="exercise" aria-pressed="false">Дасгал</button>
      <button type="button" data-view="docs" aria-pressed="false">Баримт бичиг</button>
    </nav>
  </header>

  <main class="layout" id="view-content">
    <nav class="sidebar" aria-label="Бүлэг ба сэдэв">
      <div class="chapter-tabs" id="chapter-tabs" role="tablist"></div>
      <p class="chapter-title" id="chapter-title"></p>
      <ol class="topic-list" id="topic-list"></ol>
    </nav>

    <article class="topic" id="topic" aria-live="polite"></article>
  </main>

  <main class="layout" id="view-exercise" hidden>
    <nav class="sidebar" aria-label="Дасгалын жишээ">
      <p class="chapter-title">Алдаа олж засах дасгал</p>
      <ol class="topic-list" id="exercise-list"></ol>
    </nav>

    <article class="topic" id="exercise-area"></article>
  </main>

  <nav class="pager" id="pager" aria-label="Сэдэв шилжих">
    <button type="button" id="prev-btn">← Өмнөх</button>
    <span class="pager-pos" id="pager-pos"></span>
    <button type="button" id="next-btn">Дараах →</button>
  </nav>

  <main class="layout" id="view-docs" hidden>
    <nav class="sidebar" aria-label="Баримтын төрөл ба нэр">
      <div class="chapter-tabs" id="docs-tabs" role="tablist"></div>
      <p class="chapter-title" id="docs-title"></p>
      <ol class="topic-list" id="docs-list"></ol>
    </nav>

    <article class="topic" id="docs-area" aria-live="polite"></article>
  </main>

  <nav class="pager" id="docs-pager" aria-label="Баримт шилжих" hidden>
    <button type="button" id="docs-prev">← Өмнөх</button>
    <span class="pager-pos" id="docs-pos"></span>
    <button type="button" id="docs-next">Дараах →</button>
  </nav>

  <script src="data.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
  <script src="docs-data.js"></script>
  <script src="docs-view.js"></script>
</body>
</html>
